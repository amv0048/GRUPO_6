<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <style type="text/css"><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,900&display=swap');
      .logo-text {
        font-family: 'Fraunces', serif;
        font-weight: 900;
        font-size: 145px;
        fill: #FFFFFF;
        text-anchor: middle;
        font-feature-settings: "ss01";
      }
    ]]></style>
  </defs>

  <!-- Fondo redondeado color terracota -->
  <rect x="0" y="0" width="200" height="200" rx="36" ry="36" fill="#C97041"/>

  <!-- Texto "gc" con Fraunces (ligeramente desplazado a la derecha) -->
  <text x="110" y="148" class="logo-text">gc</text>
</svg>
